<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AgencyOS — sem conexão</title>
  <style>
    :root { color-scheme: light dark; --bg: #f9fafb; --card: #fff; --fg: #212b36; --muted: #637381; --border: #dfe3e8; --primary: #00a76f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121212; --card: #1c1c1c; --fg: #fafafa; --muted: #a3a3a3; --border: #303030; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
      font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; text-align: center; }
    svg.logo { width: 48px; height: 48px; }
    h1 { margin: 18px 0 6px; font-size: 18px; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
    button { margin-top: 22px; width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font: 600 15px/1 inherit; cursor: pointer; }
    button:disabled { opacity: .6; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#007867"/><path d="M11.5 29 20 11 28.5 29" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="23.6" r="2.4" fill="#C8FAD6"/></svg>
    <h1>Sem conexão com o AgencyOS</h1>
    <p>Verifique a internet do aparelho. Assim que a conexão voltar, o app abre a versão mais recente automaticamente.</p>
    <button id="retry" type="button">Tentar novamente</button>
  </main>
  <script src="config.js"></script>
  <script>
    // Reveal this screen right away instead of waiting for the launch screen's safety timeout.
    try { window.Capacitor && window.Capacitor.nativePromise('SplashScreen', 'hide', { fadeOutDuration: 200 }) } catch (e) {}
    var btn = document.getElementById('retry')
    function retry() {
      var url = window.AGENCYOS_URL
      if (!url) return location.reload()
      btn.disabled = true
      btn.textContent = 'Conectando…'
      location.replace(url)
    }
    btn.addEventListener('click', retry)
    // Reconnect on its own as soon as the device is back online.
    window.addEventListener('online', retry)
  </script>
</body>
</html>
