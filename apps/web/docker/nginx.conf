# Serves the built SPA and proxies API calls to the `api` container over the internal Docker
# network, on the same origin — so the frontend's relative `axios.baseURL: '/api/v1'` keeps
# working unchanged in production, no CORS or build-time API URL needed. Your VPS's own reverse
# proxy (nginx/Traefik/whatever you already run) only ever needs to point at this container's
# published port (see docker-compose.prod.yml) — this file doesn't handle TLS/domains itself.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (images up to 5 MB, videos up to 100 MB) — nginx's default is 1 MB, which made larger
    # files fail with an HTML "413" page instead of the API's clear message.
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://api:4820/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Slow integrations (video uploads, AI generation) need more than nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Only relevant if STORAGE_TYPE=local on the API side (production defaults to S3/Supabase
    # Storage, which serves its own public URLs directly — this is just a safety net).
    location /uploads/ {
        proxy_pass http://api:4820/uploads/;
    }

    # Offline mode: the service worker and the app shell must never be cached by the browser or a
    # proxy, otherwise phones would not see new deploys.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build files never change — cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
