<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the resolved palette before first paint, including login and public pages.
      (() => {
        let preference = 'system';
        try {
          const stored = JSON.parse(localStorage.getItem('agencyos-theme') || 'null');
          const value = stored?.state?.preference;
          if (value === 'light' || value === 'dark') preference = value;
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <meta name="description" content="AgencyOS — O sistema operacional da sua agência de publicidade" />
    <title>AgencyOS</title>
    <style>
      /* Boot screen: painted before any JS loads, replaced by React on first render. Inside the
         Android app it matches the native launch screen (brand green) so the handoff is seamless. */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #fff; color: #212b36; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .dark .boot { background: #121212; color: #fafafa; }
      .native .boot { background: #007867; color: #fff; }
      .boot-brand { display: flex; align-items: center; gap: 12px; }
      .boot-brand svg { width: 52px; height: 52px; border-radius: 12px; }
      .native .boot-brand { flex-direction: column; gap: 16px; }
      .native .boot-brand svg { width: 72px; height: 72px; }
      .boot-name { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
      .boot-name span { color: #00a76f; }
      .native .boot-name span { color: #c8fad6; }
      .boot-bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(145,158,171,.25); }
      .native .boot-bar { background: rgba(255,255,255,.22); }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #00a76f; animation: boot-slide 1.1s cubic-bezier(.4,0,.2,1) infinite; }
      .native .boot-bar i { background: #fff; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { animation: none; width: 100%; opacity: .5; } }
    </style>
    <script>
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
        document.documentElement.classList.add('native');
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Carregando AgencyOS">
        <div class="boot-brand">
          <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#007867"/><path d="M11.5 29 20 11 28.5 29" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="23.6" r="2.4" fill="#C8FAD6"/></svg>
          <div class="boot-name">Agency<span>OS</span></div>
        </div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
