<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the resolved palette before first paint, including login and public pages.
      (() => {
        let preference = 'system';
        try {
          const stored = JSON.parse(localStorage.getItem('agencyos-theme') || 'null');
          const value = stored?.state?.preference;
          if (value === 'light' || value === 'dark') preference = value;
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgencyOS — O sistema operacional da sua agência de publicidade" />
    <title>AgencyOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
